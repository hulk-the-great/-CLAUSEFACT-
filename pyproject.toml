[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausefact"
version = "0.1.0"
description = "Clause-level evidence-graph verification for abstractive summary faithfulness"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CLAUSEFACT Contributors"}]
keywords = ["faithfulness", "summarization", "natural-language-inference", "evidence-graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# A dependency-light CLI permits inspect/preprocess and tests without installing ML libraries.
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.2,<3", "transformers>=4.40,<5"]
dev = ["pytest>=8"]
all = ["torch>=2.2,<3", "transformers>=4.40,<5", "pytest>=8"]

[project.scripts]
clausefact = "clausefact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
