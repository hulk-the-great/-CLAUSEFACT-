name: tests
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: CLI offline smoke test
        run: >-
          clausefact inspect
          --source-text 'Rina joined Blue Labs in 2020. Blue Labs is in Mumbai.'
          --summary-text 'Rina joined Blue Labs in 2020.'
